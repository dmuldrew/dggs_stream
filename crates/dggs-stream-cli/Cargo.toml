[package]
name = "dggs-stream-cli"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line utilities for dggs_stream (Arrow IPC / JSONL stdout streaming, Parquet, PMTiles, and GeoTIFF inspection)"

[lints]
workspace = true

[lib]
name = "dggs_stream_cli"
crate-type = ["rlib"]

[[bin]]
name = "dggs-stream-cli"
path = "src/bin/dggs_stream.rs"

[dependencies]
dggs-stream-core = { version = "0.7.0", path = "../dggs-stream-core" }
h3o.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
parquet.workspace = true
tempfile.workspace = true
tiff.workspace = true
