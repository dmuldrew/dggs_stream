[package]
name = "dggs-stream-pg"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "PostgreSQL extension (Set-Returning Functions and H3 scalar functions) for dggs_stream"

[lints]
workspace = true

[lib]
name = "dggs_stream_pg"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Build the loadable PostgreSQL module (magic block, text/bytea functions, SRFs).
# Needs the target server's major version: DGGS_STREAM_PG_MAJOR=<n> or pg_config on PATH.
pg-extension = []

[dependencies]
dggs-stream-core = { version = "0.7.0", path = "../dggs-stream-core" }
h3o.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiff.workspace = true
