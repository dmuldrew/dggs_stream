[package]
name = "dggs-stream-duckdb"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "DuckDB C-API loadable extension for dggs_stream GeoTIFF to H3 hexagonal aggregation"

[lints]
workspace = true

[lib]
name = "dggs_stream_duckdb"
crate-type = ["rlib"]

[features]
default = []
duckdb-api-v1_5_6 = []
stream-profile = ["dggs-stream-core/stream-profile"]

[dependencies]
dggs-stream-core = { version = "0.7.0", path = "../dggs-stream-core" }
h3o.workspace = true
libc.workspace = true
parquet.workspace = true
crossbeam-deque.workspace = true

[dev-dependencies]
dggs-stream-core = { version = "0.7.0", path = "../dggs-stream-core", features = ["test-hooks"] }
# The CLI, for the cross-engine consistency test.
dggs-stream-cli = { version = "0.7.0", path = "../dggs-stream-cli" }
serde_json.workspace = true
tempfile.workspace = true
tiff.workspace = true
