name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '13 7 * * 1'
  pull_request:
    paths:
      - 'crates/dggs-stream-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/criterion_summary.py'

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Record streaming baselines
        run: cargo bench --locked -p dggs-stream-core --bench streaming
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion/

  compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Benchmark base
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git checkout --detach "$BASE_SHA"
          cargo bench --locked -p dggs-stream-core --bench streaming -- --save-baseline base
      - name: Benchmark PR
        run: |
          git checkout --detach "$GITHUB_SHA"
          mkdir -p target/criterion
          touch target/criterion/.head-start
          cargo bench --locked -p dggs-stream-core --bench streaming -- --baseline-lenient base
      - name: Summarize
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/criterion_summary.py target/criterion --baseline base --since target/criterion/.head-start --noise-threshold 0.05 --base-ref "$BASE_SHA" --head-ref "$GITHUB_SHA" | tee criterion-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: criterion-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            target/criterion/
            criterion-summary.md
