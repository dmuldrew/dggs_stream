name: Parser & Unsafe-Code Checks

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

jobs:
  # On PRs and pushes (20s per target), run all 8 targets in a single job so
  # cargo-deny, fmt, clippy, seed_corpus, and the ASan core build run once
  # instead of 8x. On the weekly schedule (300s per target), fan out in parallel.
  fuzz:
    name: Fuzz (all targets)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz
          workspaces: fuzz
      - name: Install cargo-fuzz
        shell: bash
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1 || [[ "$(cargo-fuzz --version)" != "cargo-fuzz 0.13.1" ]]; then
            rustup toolchain install 1.97.1 --profile minimal
            cargo +1.97.1 install cargo-fuzz --version 0.13.1 --locked
          fi
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config deny.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example seed_corpus
      - name: Fuzz with AddressSanitizer
        shell: bash
        run: |
          status=0
          for target in wkb geotiff predictor ipc arrow_import remap content_range partial_state; do
            echo "::group::Fuzz target: $target"
            if ! cargo fuzz run "$target" -- -max_total_time=20 -max_len=65536 -rss_limit_mb=2048 -timeout=10; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  fuzz-scheduled:
    name: Fuzz (${{ matrix.target }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wkb, geotiff, predictor, ipc, arrow_import, remap, content_range, partial_state]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuzz-${{ matrix.target }}
          workspaces: fuzz
      - name: Install cargo-fuzz
        shell: bash
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1 || [[ "$(cargo-fuzz --version)" != "cargo-fuzz 0.13.1" ]]; then
            rustup toolchain install 1.97.1 --profile minimal
            cargo +1.97.1 install cargo-fuzz --version 0.13.1 --locked
          fi
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config deny.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - run: cargo run --locked --manifest-path fuzz/Cargo.toml --example seed_corpus
      - name: Fuzz with AddressSanitizer
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=65536 -rss_limit_mb=2048 -timeout=10
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  miri:
    name: Miri (unsafe code in core and the FFI layers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri
      - run: cargo miri setup
      - run: |
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-core --lib -- columnar:: aggregator::categorical:: raster::predictor::
      # The hand-written FFI layers: DuckDB C-API structs, chunk writer, boxed lifecycles and
      # panic containment; the Python C ABI, its PyCapsule destructors and string helpers;
      # PostgreSQL fmgr entry points against in-process server stand-ins. Tests that read a
      # memory-mapped raster (Miri cannot follow file mappings) or that need real elapsed
      # time are `#[cfg_attr(miri, ignore)]`. Floats are deterministic because Miri's
      # randomised libm error trips h3o's debug assertions; tests write temporary files.
      - name: Miri (DuckDB, Python and PostgreSQL FFI)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-deterministic-floats
          DGGS_STREAM_PG_MAJOR: '16'
        run: |
          # This test drops a panic payload whose own drop panics; that second payload is
          # leaked on purpose (forgotten, not unwound across FFI), so it runs apart, with
          # leaks allowed, keeping leak checks for every other test.
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-duckdb --lib -- --skip ffi::tests::test_safe_panic_payload_to_string_secondary_panic_containment
          MIRIFLAGS="$MIRIFLAGS -Zmiri-ignore-leaks" cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-duckdb --lib -- --exact ffi::tests::test_safe_panic_payload_to_string_secondary_panic_containment
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-python --lib
          cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-python --test it -- capsules:: scalars::
          # The PostgreSQL stand-in `palloc` never frees, as memory contexts free in bulk.
          MIRIFLAGS="$MIRIFLAGS -Zmiri-ignore-leaks" cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-pg --features pg-extension --lib
          MIRIFLAGS="$MIRIFLAGS -Zmiri-ignore-leaks" cargo miri test --locked --target x86_64-unknown-linux-gnu -p dggs-stream-pg --features pg-extension --test it -- fmgr::

  tsan:
    name: ThreadSanitizer (prefetch and aggregation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=thread
      RUSTDOCFLAGS: -Zsanitizer=thread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tsan
      - run: |
          cargo test -Zbuild-std --locked --target x86_64-unknown-linux-gnu -p dggs-stream-core --lib -- raster::prefetch:: raster::remote_prefetch:: aggregator::multi_horizon::controller::
      - run: |
          cargo test -Zbuild-std --locked --target x86_64-unknown-linux-gnu -p dggs-stream-core --test it -- threading:: chunks_and_prefetch:: streaming_failures::
