name: Python Wheels

# Builds one `py3-none-<platform>` wheel per platform (Python/Polars bindings + the
# dggs-stream-cli executable) and smoke-tests each after install. Configuration lives in
# crates/dggs-stream-python/pyproject.toml under [tool.cibuildwheel]. No publishing yet.

on:
  workflow_call:
    inputs:
      skip_changes_check:
        type: boolean
        default: false
      all_platforms:
        type: boolean
        default: true
  workflow_dispatch:

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Skips the build on pull requests and pushes that only touch documentation. Skipped
  # jobs count as passing, so this stays compatible with required status checks. Tag
  # pushes, manual runs, and callers that already ran paths-filter skip this job.
  changes:
    name: Detect code changes
    if: ${{ !inputs.skip_changes_check }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' || steps.filter.outputs.wheel_readme == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        with:
          # A file counts as code unless it matches one of the documentation patterns.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!assets/**'
              - '!LICENSE'
            # Packaged as the wheel's readme (pyproject.toml)
            wheel_readme:
              - 'crates/dggs-stream-python/README.md'

  wheels:
    name: Wheels (${{ matrix.name }})
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.result != 'failure' && (inputs.skip_changes_check || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # On normal PRs, validate the Linux x86_64 wheel only; main pushes, tags,
        # manual runs, and PRs touching wheel packaging run all 4 platforms.
        include: ${{ fromJSON((inputs.all_platforms || github.event_name != 'pull_request') && '[{"name":"manylinux x86_64","os":"ubuntu-24.04"},{"name":"manylinux aarch64","os":"ubuntu-24.04-arm"},{"name":"macOS arm64 + x86_64","os":"macos-latest"},{"name":"Windows x86_64","os":"windows-latest"}]' || '[{"name":"manylinux x86_64","os":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux builds install Rust inside the manylinux container (before-all).
      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: '1.97.1'
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wheels-${{ runner.os }}

      - name: Build and test wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: crates/dggs-stream-python
          output-dir: wheelhouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
